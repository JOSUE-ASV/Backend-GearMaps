version: '3.8'

services:
  postgres-gearmaps:
    image: postgres:16-alpine
    container_name: db_gearmaps
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0104maps # Coloque a senha que preferir
      POSTGRES_DB: gearmaps_db
    ports:
      - "5432:5432"
    volumes:
      - gearmaps_pgdata:/var/lib/postgresql/data

volumes:
  gearmaps_pgdata: